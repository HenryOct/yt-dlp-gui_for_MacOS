name: YTDlpGUI
options:
  bundleIdPrefix: com.henrywan.ytdlpgui
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
targets:
  YTDlpGUI:
    type: application
    platform: macOS
    sources:
      - path: YTDlpGUI
    info:
      path: YTDlpGUI/Info.plist
      properties:
        CFBundleDisplayName: yt-dlp GUI
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrywan.ytdlpgui.YTDlpGUI
        PRODUCT_NAME: yt-dlp GUI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
